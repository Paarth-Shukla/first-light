# Runs the pipeline's unit tests on the two Python versions the project supports.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pipeline unit tests (no network)
        run: python -m unittest discover -s tests/pipeline -t .
